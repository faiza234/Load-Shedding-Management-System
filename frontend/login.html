<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Authority Login — LSMS</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div style="width:100%; max-width:380px;">
    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to home
    </a>
    <div class="auth-card">
      <h1>Authority Login</h1>
      <p class="sub">For grid officers and administrators only.</p>

      <div class="form-error" id="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="user_name">Username</label>
          <input type="text" id="user_name" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <div class="hint-box">
        Demo accounts (seeded automatically):<br/>
        user_name: <b>admin</b> · password: <b>password123</b><br/>
        user_name: <b>officer.dhaka</b> · password: <b>password123</b><br/>
        (also officer.&lt;division&gt; for each of the 8 divisions)
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = "dashboard.html";

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("login-error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    const user_name = document.getElementById("user_name").value.trim();
    const password = document.getElementById("password").value;

    try {
      const data = await api("/auth/login", { method: "POST", body: { user_name, password } });
      Auth.setSession(data.token, data.user);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    }
  });
</script>
</body>
</html>
