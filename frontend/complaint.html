<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>File a Complaint — LSMS</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="public-wrap">
  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>

  <div class="auth-card" style="max-width:none;">
    <h1>File an Outage Complaint</h1>
    <p class="sub">Tell us where and what happened — an area officer will review it.</p>

    <div class="form-error" id="form-error"></div>
    <div class="form-success" id="form-success"></div>

    <form id="complaint-form">
      <div class="field-row">
        <div class="field">
          <label for="full_name">Your full name</label>
          <input type="text" id="full_name" required />
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="text" id="phone" placeholder="01XXXXXXXXX" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email (optional)</label>
        <input type="email" id="email" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="division">Division</label>
          <select id="division" required></select>
        </div>
        <div class="field">
          <label for="area_id">District</label>
          <select id="area_id" required></select>
        </div>
      </div>

      <div class="field">
        <label for="description">What happened?</label>
        <textarea id="description" rows="4" required placeholder="e.g. Power was cut for 3 hours outside the scheduled window..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Submit complaint</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  let allAreas = [];

  async function loadAreas() {
    allAreas = await api("/areas");
    const divisions = [...new Set(allAreas.map(a => a.division))].sort();
    const divSel = document.getElementById("division");
    divSel.innerHTML = divisions.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
    populateDistricts(divisions[0]);
  }

  function populateDistricts(division) {
    const districts = allAreas.filter(a => a.division === division).sort((a,b) => a.area_name.localeCompare(b.area_name));
    document.getElementById("area_id").innerHTML =
      districts.map(a => `<option value="${a.area_id}">${escapeHtml(a.area_name)} (${escapeHtml(a.region_type)})</option>`).join("");
  }

  document.getElementById("division").addEventListener("change", (e) => populateDistricts(e.target.value));

  document.getElementById("complaint-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("form-error");
    const successBox = document.getElementById("form-success");
    errorBox.style.display = "none";
    successBox.style.display = "none";

    const payload = {
      full_name: document.getElementById("full_name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      email: document.getElementById("email").value.trim(),
      area_id: Number(document.getElementById("area_id").value),
      description: document.getElementById("description").value.trim(),
    };

    try {
      await api("/complaints", { method: "POST", body: payload });
      successBox.textContent = "Thank you — your complaint has been recorded and will be reviewed by the area officer.";
      successBox.style.display = "block";
      document.getElementById("complaint-form").reset();
      populateDistricts(document.getElementById("division").value);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    }
  });

  loadAreas().catch(err => {
    document.getElementById("form-error").textContent = "Could not load districts: " + err.message;
    document.getElementById("form-error").style.display = "block";
  });
</script>
</body>
</html>
